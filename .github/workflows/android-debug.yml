name: Build debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application script
        run: |
          node --check app.js
          node --check i18n.js
          node --check furigana.js
          node --check subjects/kana.js
          node --check subjects/kanji.js
          node --check subjects/course.js
          node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle offline web app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html app.js i18n.js furigana.js styles.css manifest.webmanifest icon.svg sw.js android/app/src/main/assets/
          cp -R subjects android/app/src/main/assets/subjects
      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Collect four independent APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/japanlife/debug/app-japanlife-debug.apk dist/JapanLife-debug.apk
          cp android/app/build/outputs/apk/hiragana/debug/app-hiragana-debug.apk dist/JapanLife-Hiragana-debug.apk
          cp android/app/build/outputs/apk/katakana/debug/app-katakana-debug.apk dist/JapanLife-Katakana-debug.apk
          cp android/app/build/outputs/apk/kanji/debug/app-kanji-debug.apk dist/JapanLife-Kanji-debug.apk
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: JapanLife-v0.3.0-four-debug-APKs
          path: dist/*.apk
          if-no-files-found: error
